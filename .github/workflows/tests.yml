name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  busted:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 5.1 is what the WoW client runs; 5.4 matches local development.
        lua: ["5.1", "5.4"]
    steps:
      - uses: actions/checkout@v4

      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: ${{ matrix.lua }}

      - uses: leafo/gh-actions-luarocks@v4

      - name: Install busted
        run: luarocks install busted

      - name: Run tests
        run: busted
